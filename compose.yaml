services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: hhs
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d hhs']
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres-data:
